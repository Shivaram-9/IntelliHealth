<!DOCTYPE html>
<html>
<head>
    <title>IntelliHealth Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <h2>🩺 IntelliHealth</h2>
</div>

<div class="container">

    <h1>Patient Health Dashboard</h1>

    <div class="grid">

        <div class="card">
            <h3>❤️ Heart Rate</h3>
            <p id="heart">-- bpm</p>
        </div>

        <div class="card">
            <h3>🌡 Temperature</h3>
            <p id="temp">-- °C</p>
        </div>

        <div class="card">
            <h3>🩸 Blood Pressure</h3>
            <p id="bp">-- / --</p>
        </div>

        <div class="card alert" id="statusCard">
            <h3>⚠ Health Status</h3>
            <p id="status">Waiting...</p>
        </div>

    </div>

    <button class="btn" onclick="generateData()">Simulate Data</button>

</div>

<script src="script.js"></script>

</body>
</html>
